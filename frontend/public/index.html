    // --- 8. SUPERVISOR APPROVAL COMPONENT ---
    function SupervisorApproval({ recommendations, onApprove, onReject, onReEvaluate, isReEvaluating, onResetDemo, isResetting, toast }) {
      const [actionInProgress, setActionInProgress] = useState(null);

      if (!recommendations) return <div className="state-container"><div className="spinner"></div>Loading approvals...</div>;

      const pending = recommendations.filter(r => r.recommendationStatus === 'RECOMMENDED' && r.recommendedLocation && r.recommendedLocation !== 'NONE');
      const approved = recommendations.filter(r => r.recommendationStatus === 'APPROVED');
      const rejected = recommendations.filter(r => r.recommendationStatus === 'REJECTED');
      const noFeasible = recommendations.filter(r => r.recommendationStatus === 'NO_FEASIBLE_LOCATION' || !r.recommendedLocation || r.recommendedLocation === 'NONE');

      const handleApproveAction = async (id) => {
        setActionInProgress(id);
        try {
          await onApprove(id);
        } finally {
          setActionInProgress(null);
        }
      };

      const handleRejectAction = async (id) => {
        setActionInProgress(id);
        try {
          await onReject(id);
        } finally {
          setActionInProgress(null);
        }
      };

      return (
        <div>

                <button
                  className="btn btn-primary"
                  onClick={onReEvaluate}
                  disabled={isReEvaluating}
                  style={{
                    backgroundColor: '#0284c7',
                    color: '#fff',
                    padding: '0.5rem 1rem',
                    borderRadius: '6px',
                    fontWeight: 600,
                    display: 'flex',
                    alignItems: 'center',
                    gap: '0.4rem',

                    className="btn"

            {pending.length === 0 ? (

                    style={{
                      backgroundColor: '#0284c7',
                      color: '#fff',
                      padding: '0.6rem 1.2rem',
                      borderRadius: '6px',
                      fontWeight: 600,
                      border: 'none',

                    }}
                  >
                    {isReEvaluating ? '⏳ Scanning Empty Slots...' : '⚡ Re-evaluate Empty Slots'}
                  </button>
                  {onResetDemo && (
                    <button
                      className="btn"
                      onClick={onResetDemo}
                      disabled={isResetting}
                      style={{
                        backgroundColor: 'rgba(239, 68, 68, 0.15)',
                        color: '#f87171',
                        border: '1px solid #ef4444',
                        padding: '0.6rem 1.2rem',
                        borderRadius: '6px',
                        fontWeight: 600,
                        cursor: isResetting ? 'wait' : 'pointer'

                    >
                      {isResetting ? '⏳ Resetting...' : '↺ Reset to Baseline'}

                      <th>Proposed Bin</th>
                      <th>Dist to Depot</th>

                      <th>Supervisor Decision</th>
                    </tr>
                  </thead>
                  <tbody>
                    {pending.map(r => (
                      <tr key={r.recommendationId}>
                        <td><strong>{r.recommendationId}</strong></td>

                        <td><strong>{r.productName}</strong></td>

                        <td><span className="badge badge-occupied">{r.currentLocation}</span></td>

                            <span style={{ color: '#94a3b8' }}>0 u</span>

                        <td style={{ fontSize: '0.8rem', color: '#cbd5e1', maxWidth: '300px' }}>{r.reason}</td>
                        <td>
                          <div style={{ display: 'flex', gap: '0.5rem' }}>
                            <button
                              className="btn btn-approve"
                              disabled={actionInProgress === r.recommendationId || !r.recommendedLocation || r.recommendedLocation === 'NONE'}
                              onClick={() => handleApproveAction(r.recommendationId)}
                              title={(!r.recommendedLocation || r.recommendedLocation === 'NONE') ? 'Cannot approve: No feasible target bin assigned' : 'Approve slot relocation'}
                              style={{
                                padding: '0.4rem 0.8rem',
                                fontSize: '0.8rem',
                                minWidth: '75px',
                                opacity: (!r.recommendedLocation || r.recommendedLocation === 'NONE') ? 0.4 : 1,
                                cursor: (!r.recommendedLocation || r.recommendedLocation === 'NONE') ? 'not-allowed' : 'pointer'
                              }}
                            >
                              {actionInProgress === r.recommendationId ? '...' : '✓ Approve'}
                            </button>
                            <button
                              className="btn btn-reject"
                              disabled={actionInProgress === r.recommendationId}
                              onClick={() => handleRejectAction(r.recommendationId)}
                              style={{ padding: '0.4rem 0.8rem', fontSize: '0.8rem', minWidth: '70px' }}
                            >
                              {actionInProgress === r.recommendationId ? '...' : '✗ Reject'}
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* Decision History (Audit Trail) */}
          {(approved.length > 0 || rejected.length > 0) && (
            <div className="section-card" style={{ marginTop: '1.5rem' }}>
              <div className="section-header">
                <div>
                  <h2 className="section-title">📋 Decision History & Supervisor Audit Trail</h2>
                  <p className="section-desc">Historical log of all approved and rejected slot change decisions.</p>
                </div>
              </div>

              <div className="table-responsive" style={{ maxHeight: '350px' }}>
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>Rec ID</th>
                      <th>SKU</th>
                      <th>Product</th>
                      <th>Current / Original Bin</th>
                      <th>Assigned Bin</th>
                      <th>Decision</th>
                      <th>Audit Note</th>
                    </tr>
                  </thead>
                  <tbody>
                    {[...approved, ...rejected].map(r => (
                      <tr key={r.recommendationId}>
                        <td><strong>{r.recommendationId}</strong></td>
                        <td>{r.skuId}</td>
                        <td>{r.productName}</td>
                        <td><span className="badge badge-occupied">{r.currentLocation}</span></td>
                        <td>
                          {r.recommendationStatus === 'APPROVED' ? (
                            <span className="badge badge-empty">{r.recommendedLocation}</span>
                          ) : (
                            <span className="badge badge-occupied">{r.currentLocation} (Retained)</span>
                          )}
                        </td>
                        <td>
                          <span
                            className="badge"
                            style={{

                                ? 'rgba(34, 197, 94, 0.2)' : 'rgba(239, 68, 68, 0.2)',
                              color: r.recommendationStatus === 'APPROVED' ? '#4ade80' : '#f87171',
                              border: `1px solid ${r.recommendationStatus === 'APPROVED' ? '#22c55e' : '#ef4444'}`
                            }}
                          >

                </table>

            </div>
          )}
        </div>
      );
    }

    const INITIAL_STOCK = {
      SKU001: 19, SKU002: 8,  SKU003: 33, SKU004: 21, SKU005: 30,
      SKU006: 0,  SKU007: 35, SKU008: 24, SKU009: 34, SKU010: 9,
      SKU011: 4,  SKU012: 28, SKU013: 38, SKU014: 24, SKU015: 5,
      SKU016: 22, SKU017: 26, SKU018: 27, SKU019: 28, SKU020: 10,
      SKU021: 34, SKU022: 32, SKU023: 1,  SKU024: 26, SKU025: 13,
      SKU026: 33, SKU027: 16, SKU028: 5,  SKU029: 36, SKU030: 39
    };

    const INITIAL_MIN_STOCK = {
      SKU001: 13, SKU002: 8,  SKU003: 15, SKU004: 9,  SKU005: 11,
      SKU006: 8,  SKU007: 6,  SKU008: 9,  SKU009: 10, SKU010: 5,
      SKU011: 8,  SKU012: 12, SKU013: 9,  SKU014: 6,  SKU015: 10,
      SKU016: 13, SKU017: 15, SKU018: 10, SKU019: 14, SKU020: 8,
      SKU021: 9,  SKU022: 5,  SKU023: 10, SKU024: 8,  SKU025: 8,
      SKU026: 12, SKU027: 6,  SKU028: 7,  SKU029: 13, SKU030: 15
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('overview');
      const [loading, setLoading] = useState(true);
      const [backendOnline, setBackendOnline] = useState(false);
      const [toast, setToast] = useState(null);

      const [products, setProducts] = useState([]);
      const [locations, setLocations] = useState([]);
      const [demand, setDemand] = useState([]);
      const [recommendations, setRecommendations] = useState([]);
      const [routes, setRoutes] = useState([]);
      const [replenishment, setReplenishment] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [affinityPairs, setAffinityPairs] = useState([]);
      const [isResetting, setIsResetting] = useState(false);
      const [stockLevels, setStockLevels] = useState({});

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const loadFallback = () => {
        if (window.__SEED_DATA__) {
          const s = JSON.parse(JSON.stringify(window.__SEED_DATA__));
          setProducts(s.products || []);
          setLocations(s.locations || []);
          setDemand(s.demand || []);
          setRecommendations(s.recommendations || []);
          setRoutes(s.routes || []);
          setReplenishment(s.replenishment || []);
          setAnalytics(s.analytics || null);
          setAffinityPairs(s.affinityPairs || []);
        }
      };

      const loadData = useCallback(async () => {
        setLoading(true);
        try {
          const [p, l, d, rec, rt, rep, a, aff] = await Promise.all([
            warehouseApi.getProducts().catch(() => null),
            warehouseApi.getLocations().catch(() => null),
            warehouseApi.getDemand().catch(() => null),
            warehouseApi.getSlotRecommendations().catch(() => null),
            warehouseApi.getAllRoutes().catch(() => null),
            warehouseApi.getReplenishmentAlerts().catch(() => null),
            warehouseApi.getAnalytics().catch(() => null),
            warehouseApi.getAffinity().catch(() => null),
          ]);

          if (p && l && a) {
            setProducts(p);
            setLocations(l);
            setDemand(d || []);
            setRecommendations(rec || []);
            setRoutes(rt || []);
            setReplenishment(rep || []);
            setAnalytics(a);
            setAffinityPairs(aff || (window.__SEED_DATA__ && window.__SEED_DATA__.affinityPairs) || []);
            setBackendOnline(true);
          } else {
            loadFallback();
            setBackendOnline(false);
          }
        } catch (err) {
          loadFallback();
          setBackendOnline(false);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        loadData();
      }, [loadData]);

      const handleApprove = async (id) => {
        try {
          if (backendOnline) {
            const resp = await warehouseApi.approveSlot(id);
            showToast(resp.message || `Slot ${id} approved successfully`, 'success');
            const [updatedRecs, updatedAnalytics, updatedProds, updatedLocs] = await Promise.all([
              warehouseApi.getSlotRecommendations(),
              warehouseApi.getAnalytics(),
              warehouseApi.getProducts().catch(() => null),
              warehouseApi.getLocations().catch(() => null)
            ]);
            setRecommendations(updatedRecs);
            setAnalytics(updatedAnalytics);
            if (updatedProds) setProducts(updatedProds);
            if (updatedLocs) setLocations(updatedLocs);
          } else {
            const rec = recommendations.find(r => r.recommendationId === id);
            setRecommendations(prev => prev.map(r => r.recommendationId === id ? { ...r, recommendationStatus: 'APPROVED' } : r));
            if (rec && rec.recommendedLocation !== 'NONE') {
              setProducts(prev => prev.map(p => p.skuId === rec.skuId ? { ...p, currentLocation: rec.recommendedLocation } : p));
              setLocations(prev => prev.map(l => {
                if (l.locationId === rec.recommendedLocation) return { ...l, status: 'OCCUPIED' };
                if (l.locationId === rec.currentLocation) return { ...l, status: 'EMPTY' };
                return l;
              }));
            }
            showToast(`Slot recommendation ${id} approved (preview update)`, 'success');
          }
        } catch (e) {
          showToast(e.message || 'Approval failed', 'error');
        }
      };

      const handleReject = async (id) => {
        try {
          if (backendOnline) {
            const resp = await warehouseApi.rejectSlot(id);
            showToast(resp.message || `Slot ${id} rejected`, 'success');
            const [updatedRecs, updatedAnalytics, updatedProds, updatedLocs] = await Promise.all([
              warehouseApi.getSlotRecommendations(),
              warehouseApi.getAnalytics(),
              warehouseApi.getProducts().catch(() => null),
              warehouseApi.getLocations().catch(() => null)
            ]);
            setRecommendations(updatedRecs);
            setAnalytics(updatedAnalytics);
            if (updatedProds) setProducts(updatedProds);
            if (updatedLocs) setLocations(updatedLocs);
          } else {
            setRecommendations(prev => {
              const rejectedRec = prev.find(r => r.recommendationId === id);
              const updated = prev.map(r => r.recommendationId === id ? { ...r, recommendationStatus: 'REJECTED' } : r);
              if (rejectedRec && rejectedRec.recommendedLocation && rejectedRec.recommendedLocation !== 'NONE') {
                const targetLoc = rejectedRec.recommendedLocation;
                const busySkus = new Set(updated.filter(r => r.recommendationStatus === 'RECOMMENDED' || r.recommendationStatus === 'APPROVED' || r.recommendationStatus === 'REJECTED').map(r => r.skuId));
                busySkus.add(rejectedRec.skuId);
                const candidate = updated.find(r => r.recommendationStatus === 'NO_FEASIBLE_LOCATION' && !busySkus.has(r.skuId));
                if (candidate) {
                  return updated.map(r => r.recommendationId === candidate.recommendationId ? {
                    ...r,
                    recommendedLocation: targetLoc,
                    recommendationStatus: 'RECOMMENDED',
                    distanceSaved: Math.max(5, (candidate.distance || 40) - 10),
                    reason: `Dynamic Re-Slotting: Allocated to available empty slot ${targetLoc}. Relocation reduces travel distance.`
                  } : r);
                }
              }
              return updated;
            });
            showToast(`Slot recommendation ${id} rejected (preview update)`, 'success');
          }
        } catch (e) {
          showToast(e.message || 'Rejection failed', 'error');
        }
      };

      const [isReEvaluating, setIsReEvaluating] = useState(false);

      const handleReEvaluate = async () => {
        setIsReEvaluating(true);
        try {
          if (backendOnline) {
            const updatedRecs = await warehouseApi.reEvaluateSlots();
            const [updatedAnalytics, updatedProds, updatedLocs] = await Promise.all([
              warehouseApi.getAnalytics(),
              warehouseApi.getProducts().catch(() => null),
              warehouseApi.getLocations().catch(() => null)
            ]);
            setRecommendations(updatedRecs);
            setAnalytics(updatedAnalytics);
            if (updatedProds) setProducts(updatedProds);
            if (updatedLocs) setLocations(updatedLocs);
            showToast('⚡ Dynamic Re-evaluation complete: Empty slots scanned and matched with candidate SKUs.', 'success');
          } else {
            showToast('⚡ Evaluated empty warehouse slots (standalone mode).', 'success');
          }
        } catch (e) {
          showToast(e.message || 'Re-evaluation failed', 'error');
        } finally {
          setIsReEvaluating(false);
        }
      };

      const handleResetDemo = async () => {
        if (!window.confirm('Reset warehouse demo state back to baseline? All approved slot changes and custom modifications will be reverted.')) {
          return;
        }
        setIsResetting(true);
        try {
          setStockLevels({});
          if (backendOnline) {
            const resp = await warehouseApi.resetDemoState();
            showToast(resp.message || 'Warehouse reset to baseline seed state.', 'success');
            await loadData();
          } else {
            loadFallback();
            showToast('Warehouse reset to baseline seed state (standalone mode).', 'success');
          }
        } catch (err) {
          showToast(err.message || 'Failed to reset demo state', 'error');
        } finally {
          setIsResetting(false);
        }
      };

      const handleVacateLocation = async (locationId) => {
        try {
          if (backendOnline) {
            const resp = await warehouseApi.vacateLocation(locationId);
            showToast(resp.message || `Location ${locationId} vacated to EMPTY in database.`, 'success');
            const [updatedLocs, updatedProds, updatedRecs, updatedAnalytics] = await Promise.all([
              warehouseApi.getLocations(),
              warehouseApi.getProducts().catch(() => null),
              warehouseApi.getSlotRecommendations().catch(() => null),
              warehouseApi.getAnalytics().catch(() => null)
            ]);
            if (updatedLocs) setLocations(updatedLocs);
            if (updatedProds) setProducts(updatedProds);
            if (updatedRecs) setRecommendations(updatedRecs);
            if (updatedAnalytics) setAnalytics(updatedAnalytics);
          } else {
            setLocations(prev => prev.map(l => l.locationId === locationId ? { ...l, status: 'EMPTY' } : l));
            setProducts(prev => prev.map(p => p.currentLocation === locationId ? { ...p, currentLocation: 'UNASSIGNED' } : p));
            setAnalytics(prev => prev ? {
              ...prev,
              occupiedLocations: Math.max(0, prev.occupiedLocations - 1),
              emptyLocations: prev.emptyLocations + 1
            } : prev);
            showToast(`Location ${locationId} vacated to EMPTY (standalone mode).`, 'success');
          }
        } catch (err) {
          showToast(err.message || 'Failed to vacate location', 'error');
        }
      };

      const updateReplenishmentList = (skuId, prodName, newStock, minStock) => {
        setReplenishment(prev => {
          const status = newStock === 0 ? 'OUT_OF_STOCK' : (newStock <= minStock ? 'LOW_STOCK' : 'HEALTHY');
          const isAlert = newStock <= minStock;
          const existing = prev.find(r => r.skuId === skuId);

          if (isAlert) {
            const newItem = {
              skuId,
              productName: prodName,
              currentStock: newStock,
              minimumStock: minStock,
              stockStatus: status,
              replenishmentRequired: 'YES'
            };
            if (existing) {
              return prev.map(r => r.skuId === skuId ? newItem : r);
            } else {
              return [...prev, newItem];
            }
          } else {
            return prev.filter(r => r.skuId !== skuId);
          }
        });
      };

      const handleAdjustStock = (skuId, delta) => {
        const prod = (products || []).find(p => p.skuId === skuId);
        const prodName = prod ? prod.productName : skuId;
        const locId = prod ? prod.currentLocation : null;
        const loc = locId && locations ? locations.find(l => l.locationId === locId) : null;
        const maxCapacity = loc ? loc.capacity : (prod && prod.requiredCapacity ? prod.requiredCapacity : 30);

        const alertItem = (replenishment || []).find(r => r.skuId === skuId);
        const currentStock = stockLevels[skuId] !== undefined
          ? stockLevels[skuId]
          : (alertItem ? alertItem.currentStock : (INITIAL_STOCK[skuId] ?? 15));
        const minStock = alertItem ? alertItem.minimumStock : (INITIAL_MIN_STOCK[skuId] ?? 10);

        if (delta > 0) {
          // Restock: Check shelf capacity constraint
          if (currentStock >= maxCapacity) {
            showToast(
              `⚠️ Shelf Capacity Limit Reached: ${skuId} (${prodName}) in shelf ${locId || 'N/A'} is already at 100% capacity (${currentStock}/${maxCapacity} units). Restock blocked.`,
              'error'
            );
            return;
          }

          if (currentStock + delta > maxCapacity) {
            const allowableAdd = maxCapacity - currentStock;
            const rejectedQty = delta - allowableAdd;
            const newStock = maxCapacity; // Enforce hard cap

            setStockLevels(prev => ({ ...prev, [skuId]: newStock }));
            updateReplenishmentList(skuId, prodName, newStock, minStock);

            showToast(
              `⚠️ Shelf Capacity Hard Cap: Shelf ${locId || ''} capacity limit is ${maxCapacity} units (Current: ${currentStock}). Added +${allowableAdd} units to fill shelf. ${rejectedQty} units rejected due to physical capacity constraint.`,
              'error'
            );
            return;
          }

          const newStock = currentStock + delta;
          setStockLevels(prev => ({ ...prev, [skuId]: newStock }));
          updateReplenishmentList(skuId, prodName, newStock, minStock);

          const status = newStock <= minStock ? 'LOW_STOCK' : 'HEALTHY';
          showToast(
            `Restocked (+) ${delta} units of ${skuId} into shelf ${locId || 'N/A'}. Current stock: ${newStock}/${maxCapacity} units (${status}).`,
            'success'
          );
        } else {
          // Pick / Dispatch: delta < 0
          const pickQty = Math.abs(delta);
          if (currentStock === 0) {
            showToast(`⚠️ Cannot dispatch ${skuId}: Shelf ${locId || 'N/A'} is completely out of stock (0 units).`, 'error');
            return;
          }

          const actualPicked = Math.min(pickQty, currentStock);
          const newStock = Math.max(0, currentStock - pickQty);
          setStockLevels(prev => ({ ...prev, [skuId]: newStock }));
          updateReplenishmentList(skuId, prodName, newStock, minStock);

          const status = newStock === 0 ? 'OUT_OF_STOCK' : (newStock <= minStock ? 'LOW_STOCK' : 'HEALTHY');
          showToast(
            `Dispatched (-) ${actualPicked} units of ${skuId} from shelf ${locId || 'N/A'}. Current stock: ${newStock}/${maxCapacity} units (${status}).`,
            newStock <= minStock ? 'error' : 'success'
          );
        }
      };

      const counts = {
        products: products.length,
        locations: locations.length,
        demand: demand.length,
        recommendations: recommendations.length,
        routes: routes.length,
        replenishment: replenishment.length,
        pendingApproval: recommendations.filter(r => r.recommendationStatus === 'RECOMMENDED').length
      };

      return (
        <div className="dashboard-container">
          <Header />
          <Navbar activeTab={activeTab} setActiveTab={setActiveTab} counts={counts} />
          <main className="main-content">
            {loading ? (
              <div className="state-container">
                <div className="spinner"></div>
                <p>Loading CAP-12 Warehouse Management System...</p>
              </div>
            ) : (
              <>
                {activeTab === 'overview' && (
                  <WarehouseOverview
                    analytics={analytics}
                    routes={routes}
                    recommendations={recommendations}
                    replenishment={replenishment}
                  />
                )}
                {activeTab === 'products' && <ProductMaster products={products} />}
                {activeTab === 'locations' && (
                  <WarehouseLocations
                    locations={locations}
                    products={products}
                    demand={demand}
                    onVacateLocation={handleVacateLocation}
                  />
                )}
                {activeTab === 'demand' && <DemandClassification demand={demand} affinityPairs={affinityPairs} />}
                {activeTab === 'recommendations' && (
                  <SlotRecommendations
                    recommendations={recommendations}
                    onResetDemo={handleResetDemo}
                    isResetting={isResetting}
                  />
                )}
                {activeTab === 'pickpath' && <PickPathOptimization routes={routes} products={products} locations={locations} />}
                {activeTab === 'replenishment' && (
                  <ReplenishmentAlerts
                    replenishment={replenishment}
                    products={products}
                    locations={locations}
                    stockLevels={stockLevels}
                    onAdjustStock={handleAdjustStock}
                  />
                )}
                {activeTab === 'approval' && (
                  <SupervisorApproval
                    recommendations={recommendations}
                    onApprove={handleApprove}
                    onReject={handleReject}
                    onReEvaluate={handleReEvaluate}
                    isReEvaluating={isReEvaluating}
                    onResetDemo={handleResetDemo}
                    isResetting={isResetting}
                    toast={toast}
                  />
                )}
              </>
            )}
          </main>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>
</body>
</html>
