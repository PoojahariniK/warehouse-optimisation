name: CAP-12 CI/CD Pipeline

# Required permissions for pushing images to GHCR
permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-test:
    name: Python Optimization Engine & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Optimization Engine Pipeline
        run: |
          python -m src.optimization_engine.main

      - name: Run Unit Tests with Pytest
        run: |
          pytest -v --junitxml=pytest-report.xml

  backend-build:
    name: Spring Boot Java 21 Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./backend
        run: |
          mvn clean package -DskipTests

  docker-lint-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [python-test, backend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Services (lint only)
        run: |
          docker compose build

  docker-push:
    name: Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: docker-lint-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Python optimisation engine image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./python/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/smart-warehouse-python:latest

      - name: Build & push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/smart-warehouse-backend:latest

      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/smart-warehouse-frontend:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SSH client and rsync
        run: sudo apt-get update && sudo apt-get install -y openssh-client rsync

      - name: Add SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync project to EC2 (excluding .env)
        run: |
          rsync -avz --exclude='.git' --exclude='node_modules' . ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/smart-warehouse-optimizer/

      - name: Create .env on EC2 (credentials stay secret)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
          REACT_APP_API_BASE_URL: http://${{ secrets.EC2_HOST }}:8080/api
          DISPATCH_POINT_X: ${{ secrets.DISPATCH_POINT_X }}
          DISPATCH_POINT_Y: ${{ secrets.DISPATCH_POINT_Y }}
          WALKING_SPEED: ${{ secrets.WALKING_SPEED }}
          PICK_HANDLING_TIME: ${{ secrets.PICK_HANDLING_TIME }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          SNOWFLAKE_STAGE: ${{ secrets.SNOWFLAKE_STAGE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<'EOF'
          cat > ~/smart-warehouse-optimizer/.env <<EOT
          SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT}
          SNOWFLAKE_USER=${SNOWFLAKE_USER}
          SNOWFLAKE_PASSWORD=${SNOWFLAKE_PASSWORD}
          SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE}
          SNOWFLAKE_DATABASE=${SNOWFLAKE_DATABASE}
          SNOWFLAKE_SCHEMA=${SNOWFLAKE_SCHEMA}
          SNOWFLAKE_ROLE=${SNOWFLAKE_ROLE}

          SERVER_PORT=${SERVER_PORT}
          SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}

          REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}

          DISPATCH_POINT_X=${DISPATCH_POINT_X}
          DISPATCH_POINT_Y=${DISPATCH_POINT_Y}
          WALKING_SPEED=${WALKING_SPEED}
          PICK_HANDLING_TIME=${PICK_HANDLING_TIME}

          AWS_S3_BUCKET=${AWS_S3_BUCKET}
          SNOWFLAKE_STAGE=${SNOWFLAKE_STAGE}
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          EOT
          EOF

      - name: Deploy with Docker Compose on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true && cd ~/smart-warehouse-optimizer && (docker compose pull || true) && docker compose up -d --build --remove-orphans && docker image prune -f"
