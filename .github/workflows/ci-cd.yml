name: CAP-12 CI/CD Pipeline

# Required permissions for pushing images to GHCR
permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-test:
    name: Python Optimization Engine & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Optimization Engine Pipeline
        run: |
          python -m src.optimization_engine.main

      - name: Run Unit Tests with Pytest
        run: |
          pytest -v --junitxml=pytest-report.xml

  backend-build:
    name: Spring Boot Java 21 Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./backend
        run: |
          mvn clean package -DskipTests

  docker-lint-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [python-test, backend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Services (lint only)
        run: |
          docker compose build

  docker-push:
    name: Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: docker-lint-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Python optimisation engine image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./python/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/smart-warehouse-python:latest

      - name: Build & push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/smart-warehouse-backend:latest

      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/smart-warehouse-frontend:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SSH client and rsync
        run: sudo apt-get update && sudo apt-get install -y openssh-client rsync

      - name: Add SSH private key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Strip any Windows \r and write clean private key
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # Auto-sanitize username to remove any unicode non-breaking hyphens and test connection
      - name: Validate SSH connection and detect user
        run: |
          RAW_USER="${{ secrets.EC2_USER }}"
          # Replace unicode hyphens or non-ascii with standard hyphen
          CLEAN_USER=$(echo "$RAW_USER" | sed 's/[^a-zA-Z0-9_-]//g')
          if [[ "$CLEAN_USER" =~ ec2.*user ]] || [ -z "$CLEAN_USER" ]; then
            CLEAN_USER="ec2-user"
          elif [[ "$CLEAN_USER" =~ ubuntu ]]; then
            CLEAN_USER="ubuntu"
          fi

          echo "Checking connection to ${{ secrets.EC2_HOST }}..."
          CONNECTED_USER=""
          for u in "$CLEAN_USER" "ec2-user" "ubuntu"; do
            echo "Testing user '$u'..."
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$u@${{ secrets.EC2_HOST }}" "echo ok" 2>/dev/null | grep -q "ok"; then
              CONNECTED_USER="$u"
              echo "Connected successfully as user: $u"
              break
            fi
          done

          if [ -z "$CONNECTED_USER" ]; then
            echo "::error::SSH authentication failed for tested users ($CLEAN_USER, ec2-user, ubuntu)."
            echo "Printing SSH debug output:"
            ssh -vvv -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$CLEAN_USER@${{ secrets.EC2_HOST }}" "echo test"
            exit 1
          fi

          echo "SSH_USER=$CONNECTED_USER" >> $GITHUB_ENV

      - name: Prepare remote directory
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ env.SSH_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/smart-warehouse-optimizer"

      - name: Sync project to EC2 (excluding .env)
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.deploy' \
            . ${{ env.SSH_USER }}@${{ secrets.EC2_HOST }}:~/smart-warehouse-optimizer/

      - name: Create .env on EC2 (credentials stay secret)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ env.SSH_USER }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
          REACT_APP_API_BASE_URL: http://${{ secrets.EC2_HOST }}:8080/api
          DISPATCH_POINT_X: ${{ secrets.DISPATCH_POINT_X }}
          DISPATCH_POINT_Y: ${{ secrets.DISPATCH_POINT_Y }}
          WALKING_SPEED: ${{ secrets.WALKING_SPEED }}
          PICK_HANDLING_TIME: ${{ secrets.PICK_HANDLING_TIME }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          SNOWFLAKE_STAGE: ${{ secrets.SNOWFLAKE_STAGE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os

          keys = [
              "SNOWFLAKE_ACCOUNT",
              "SNOWFLAKE_USER",
              "SNOWFLAKE_PASSWORD",
              "SNOWFLAKE_WAREHOUSE",
              "SNOWFLAKE_DATABASE",
              "SNOWFLAKE_SCHEMA",
              "SNOWFLAKE_ROLE",
              "SERVER_PORT",
              "SPRING_PROFILES_ACTIVE",
              "REACT_APP_API_BASE_URL",
              "DISPATCH_POINT_X",
              "DISPATCH_POINT_Y",
              "WALKING_SPEED",
              "PICK_HANDLING_TIME",
              "AWS_S3_BUCKET",
              "SNOWFLAKE_STAGE",
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
          ]

          with open(".env.deploy", "w") as f:
              for key in keys:
                  value = os.environ.get(key, "")
                  value = value.replace("\\", "\\\\")
                  value = value.replace("'", "\\'")
                  value = value.replace("\n", "\\n")
                  f.write(f"{key}='{value}'\n")
          PY

          chmod 600 .env.deploy

          scp -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            .env.deploy \
            "$SSH_USER@$EC2_HOST:~/smart-warehouse-optimizer/.env"

          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$EC2_HOST" \
            "chmod 600 ~/smart-warehouse-optimizer/.env"

          rm -f .env.deploy

      - name: Deploy with Docker Compose on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ env.SSH_USER }}@${{ secrets.EC2_HOST }} "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && cd ~/smart-warehouse-optimizer && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
