name: CAP-12 CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-test:
    name: Python Optimization Engine & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Optimization Engine Pipeline
        run: |
          python -m src.optimization_engine.main

      - name: Run Unit Tests with Pytest
        run: |
          pytest -v --junitxml=pytest-report.xml

  backend-build:
    name: Spring Boot Java 21 Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./backend
        run: |
          mvn clean package -DskipTests

  docker-lint-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [python-test, backend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Services
        run: |
          docker compose build

