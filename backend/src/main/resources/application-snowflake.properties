# Snowflake Production Database Configuration
# Injected dynamically from .env or environment variables
spring.datasource.url=jdbc:snowflake://${SNOWFLAKE_ACCOUNT}.snowflakecomputing.com/?db=${SNOWFLAKE_DATABASE:CAPSTONE_12_DB}&schema=${SNOWFLAKE_SCHEMA:CLEAN}&warehouse=${SNOWFLAKE_WAREHOUSE:CAP12_WH}&role=${SNOWFLAKE_ROLE:ACCOUNTADMIN}&jdbc_query_result_format=JSON
spring.datasource.driverClassName=net.snowflake.client.jdbc.SnowflakeDriver
spring.datasource.username=${SNOWFLAKE_USER}
spring.datasource.password=${SNOWFLAKE_PASSWORD}
spring.sql.init.mode=never