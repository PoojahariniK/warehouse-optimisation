server.port=${SERVER_PORT:8080}
spring.application.name=warehouse-optimization-backend

# Active profile: local (default) or snowflake
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Local Embedded Database Configuration (H2 in PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:cap12db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Seed schema and data
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

